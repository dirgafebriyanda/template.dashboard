<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="../../assets/img/logo/nuanxa-favicon.png"
    />
    <title>Nuanxa - Forgot Password</title>
    <link
      rel="stylesheet"
      href="../../assets/fontawesome-free-7.0.1-web/css/all.min.css"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <script>
      // Pastikan fungsi applyTheme dan inisialisasi tema tetap ada
      function applyTheme(theme) {
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      }

      let current = localStorage.theme;
      if (!current) {
        current = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        localStorage.theme = current;
      }

      applyTheme(current);
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-50">
    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-24">
      <div class="flex justify-center max-h-[30rem]">
        <div
          class="lg:w-1/2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 shadow-md shadow-blue-200 dark:shadow-gray-700 rounded-2xl overflow-hidden"
        >
          <!-- Forgot Password Form -->
          <div class="p-4 md:px-10 md:py-8 lg:px-20 lg:py-8 w-full">
            <h1 class="text-xl font-bold text-center pb-2">Forgot Password</h1>

            <p class="text-sm text-center pb-5">
              Enter your email address and we’ll send you a link to reset your
              password
            </p>

            <form>
              <div class="my-5 relative autofill-light dark:autofill-dark">
                <i
                  class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500"
                ></i>

                <input
                  type="email"
                  id="email"
                  required
                  placeholder=" "
                  class="peer w-full pl-10 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-1 focus:ring-blue-200 focus:border-blue-200"
                />

                <label
                  for="email"
                  class="absolute left-10 top-2 px-1 text-gray-500 dark:text-gray-400 transition-[top,transform,font-size] pointer-events-none peer-placeholder-shown:top-2 peer-placeholder-shown:text-base peer-focus:-top-3 peer-focus:text-sm peer-[&:not(:placeholder-shown)]:-top-3 peer-[&:not(:placeholder-shown)]:text-sm peer-focus:left-2 peer-[&:not(:placeholder-shown)]:left-2 bg-white dark:bg-gray-800"
                >
                  Email
                </label>
              </div>

              <button
                type="submit"
                class="w-full px-3 py-2 mb-5 text-sm font-semibold rounded-lg text-white bg-gradient-to-tl from-indigo-600 to-blue-500 hover:from-indigo-700 hover:to-blue-600 dark:from-indigo-500 dark:to-blue-400 dark:hover:from-indigo-400 dark:hover:to-blue-300 transition"
              >
                Send Reset Link
              </button>

              <div class="text-sm text-gray-500 dark:text-gray-400 text-center">
                Remember your password?
                <a
                  href="login.html"
                  class="text-blue-600 dark:text-blue-400 hover:underline"
                >
                  Login
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script src="../../assets/js/script.js"></script>
  </body>
</html>
